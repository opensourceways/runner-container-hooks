name: Build & Push runner image

# 用 runner-versions.yaml 里的每个底座版本构建自有 runner 镜像并推送到 SWR。
# - 打 tag（v*）时：镜像 tag = <runner-version>-<git-tag>（不可变，生产引用）
# - 推分支时：镜像 tag = <runner-version>-<branch>-<短sha>（测试/开发用，可变）
# 底座版本升级只改 .github/runner-versions.yaml，不改 Dockerfile。
on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
      - '!dependabot/**'
  workflow_dispatch:

env:
  REGISTRY: swr.cn-southwest-2.myhuaweicloud.com
  IMAGE_NAME: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/runner
  BASE_REGISTRY: ghcr.io

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          matrix=$(grep -E '^\s*-\s*"' .github/runner-versions.yaml \
            | sed 's/.*"\(.*\)".*/\1/' | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner_version: ${{ fromJson(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: tag
        run: |
          short=$(printf '%s' "$GITHUB_SHA" | cut -c1-6)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            suffix="${GITHUB_REF_NAME}"
          else
            # 分支名里的 / 等非法字符替换为 -，才能作为 docker tag
            branch=$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's#[^A-Za-z0-9_.-]#-#g')
            suffix="${branch}-${short}"
          fi
          tag="${{ matrix.runner_version }}-${suffix}"
          tag="${tag:0:120}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${tag}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            RUNNER_VERSION=${{ matrix.runner_version }}
            BASE_REGISTRY=${{ env.BASE_REGISTRY }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.runner_version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner_version }}
