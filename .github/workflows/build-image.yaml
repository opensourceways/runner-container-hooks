name: Build & Push runner image

# 手动触发：构建并推送自有 runner 镜像到 SWR。
# 不在 push 时自动跑（省资源、避免堆镜像 tag），也不创建 git tag。
# 触发：Actions 页面 → Run workflow，可选填 runner_version / image_tag。
on:
  workflow_dispatch:
    inputs:
      runner_version:
        description: 'runner base version (default: latest in .github/runner-versions.yaml)'
        type: string
        required: false
      image_tag:
        description: 'image tag (default: <runner-version>-<branch>-<shortsha>)'
        type: string
        required: false

env:
  REGISTRY: swr.cn-southwest-2.myhuaweicloud.com
  IMAGE_NAME: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/runner
  BASE_REGISTRY: ghcr.io

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      runner_version: ${{ steps.r.outputs.runner_version }}
      image_tag: ${{ steps.r.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5
      - id: r
        run: |
          rv="${{ inputs.runner_version }}"
          if [ -z "$rv" ]; then
            rv=$(grep -E '^\s*-\s*"' .github/runner-versions.yaml \
              | sed 's/.*"\(.*\)".*/\1/' | sort -V | tail -1)
          fi
          echo "runner_version=${rv}" >> "$GITHUB_OUTPUT"

          it="${{ inputs.image_tag }}"
          if [ -z "$it" ]; then
            short=$(printf '%s' "$GITHUB_SHA" | cut -c1-6)
            branch=$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's#[^A-Za-z0-9_.-]#-#g')
            it="${rv}-${branch}-${short}"
          fi
          it="${it:0:120}"
          echo "image_tag=${it}" >> "$GITHUB_OUTPUT"
          echo "runner_version=${rv} image_tag=${it}"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            RUNNER_VERSION=${{ needs.resolve.outputs.runner_version }}
            BASE_REGISTRY=${{ env.BASE_REGISTRY }}
          tags: ${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
